<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6f8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Claims Helper</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <div class="page-heading">
          <h1><img class="app-icon" src="/favicon.svg" alt="">Claims Helper</h1>
          <p class="intro">Help you analyze your claims data by uploading a CSV file.</p>
        </div>
        <div class="header-upload">
          <input id="csv-file" type="file" accept=".csv,text/csv">
          <label class="file-button" for="csv-file">Load CSV file</label>
        </div>
      </header>

      <div id="status" class="toast" role="status" aria-live="polite" hidden>
        <span id="status-text"></span>
        <button id="dismiss-status" class="toast-dismiss" type="button" aria-label="Dismiss notification">×</button>
      </div>

      <section id="preview" class="preview" aria-label="CSV preview" hidden>
        <div class="preview-header">
          <p id="row-count" class="row-count"></p>
          <div class="filter-launcher">
            <p id="filter-summary" class="filter-summary"></p>
            <button id="open-filters" class="filter-toggle" type="button" aria-haspopup="dialog" aria-controls="filters-dialog">
              Filters <span id="active-filter-count" class="filter-count" hidden></span>
            </button>
          </div>
        </div>
        <dialog id="filters-dialog" class="filters-dialog" aria-labelledby="filters-title">
          <div class="drawer-header">
            <div>
              <h2 id="filters-title">Filters</h2>
              <p>Choose a year, date, and claim status.</p>
            </div>
            <button id="close-filters" class="drawer-close" type="button" aria-label="Close filters">×</button>
          </div>
          <div class="drawer-content">
            <div class="filter-toolbar">
              <button id="reset-filters" class="filter-reset" type="button" disabled>Reset filters</button>
            </div>
            <div class="filter-controls">
              <div class="year-filter">
                <h4>Service year</h4>
                <nav id="year-tabs" class="year-tabs" aria-label="Filter claims by service year"></nav>
              </div>
              <div class="date-search">
                <label for="service-date">Service date</label>
                <div class="date-inputs">
                  <input id="service-date" type="date" disabled>
                  <button id="clear-date" type="button" disabled>Clear</button>
                </div>
              </div>
              <fieldset class="status-filter">
                <legend>Status</legend>
                <div id="status-options" class="status-options"></div>
                <button id="select-all-statuses" class="status-reset" type="button" disabled>Select all</button>
              </fieldset>
            </div>
          </div>
        </dialog>
        <div class="preview-content">
          <aside class="year-summary" aria-labelledby="summary-title">
            <h3 id="summary-title">Year totals</h3>
            <dl class="summary-metrics">
              <div class="summary-metric">
                <dt>Ded</dt>
                <dd id="ded-total">$0.00</dd>
              </div>
              <div class="summary-metric">
                <dt>CoPay</dt>
                <dd id="copay-total">$0.00</dd>
              </div>
              <div class="summary-metric">
                <dt>CoIns</dt>
                <dd id="coins-total">$0.00</dd>
              </div>
              <div class="summary-metric summary-grand-total">
                <dt>Combined total</dt>
                <dd id="cost-share-total">$0.00</dd>
              </div>
            </dl>
            <dl class="summary-metrics summary-payment-metrics" aria-label="Additional year totals">
              <div class="summary-metric">
                <dt>Total Charges</dt>
                <dd id="charges-total">$0.00</dd>
              </div>
              <div class="summary-metric">
                <dt>SavDisc</dt>
                <dd id="savdisc-total">$0.00</dd>
              </div>
              <div class="summary-metric">
                <dt>Amount Paid</dt>
                <dd id="amount-paid-total">$0.00</dd>
              </div>
            </dl>
          </aside>
          <div class="table-scroll">
            <table id="csv-table"></table>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
